name: 🚀 Deploy API

on:
  workflow_dispatch:

env:
  IMAGE_NAME: home-coffing-api
  SERVICE_DIR: /Users/homelab/repos/byun618/homelab-infra/services/home-coffing
  TZ: Asia/Seoul

permissions:
  contents: read

jobs:
  parsing:
    name: 1. 파싱
    runs-on: self-hosted
    outputs:
      sha: ${{ steps.set.outputs.sha }}
      tag: ${{ steps.set.outputs.tag }}
      branch: ${{ steps.set.outputs.branch }}
    steps:
      - id: set
        run: |
          sha="${GITHUB_SHA::7}"
          branch="${{ github.ref_name }}"
          tag="${branch}-${sha}"
          {
            echo "sha=${sha}"
            echo "branch=${branch}"
            echo "tag=${tag}"
          } >> $GITHUB_OUTPUT

  build:
    name: 2. 이미지 빌드 (local)
    needs: parsing
    runs-on: self-hosted
    steps:
      - name: 2-1. 코드 체크아웃
        uses: actions/checkout@v4

      - name: 2-2. Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: 2-3. 빌드 (mac mini local daemon에 적재)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          platforms: linux/arm64
          build-args: |
            APP=api
          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.parsing.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  deploy:
    name: 3. 맥미니 배포
    needs: [parsing, build]
    runs-on: self-hosted
    steps:
      - name: 3-1. compose up
        env:
          API_IMAGE_TAG: ${{ needs.parsing.outputs.tag }}
        run: |
          cd "$SERVICE_DIR"
          docker compose up -d api
          sleep 5
          docker compose logs api --tail 50

      - name: 3-2. 디스크 정리 (untagged & 30일 경과)
        run: |
          docker image prune -af --filter "until=720h" || true

  summary:
    name: 4. 요약
    needs: [parsing, build, deploy]
    if: always()
    runs-on: self-hosted
    steps:
      - run: |
          STATUS="${{ needs.deploy.result }}"
          ICON=$([[ "$STATUS" == "success" ]] && echo "✅" || echo "❌")
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## ${ICON} Deploy API Summary

          | 항목 | 값 |
          |---|---|
          | Branch | \`${{ needs.parsing.outputs.branch }}\` |
          | Commit | \`${{ needs.parsing.outputs.sha }}\` |
          | Image | \`${{ env.IMAGE_NAME }}:${{ needs.parsing.outputs.tag }}\` |
          | Build | ${{ needs.build.result }} |
          | Deploy | ${{ needs.deploy.result }} |

          ### 🔄 롤백
          맥미니에서:
          \`\`\`bash
          cd $SERVICE_DIR
          API_IMAGE_TAG=<원하는-태그> docker compose up -d api
          \`\`\`

          이미지 목록 확인:
          \`\`\`bash
          docker images $IMAGE_NAME
          \`\`\`
          EOF
